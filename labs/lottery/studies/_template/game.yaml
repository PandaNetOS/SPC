# game.yaml — 彩种声明（模板）
#
# ⚠️ 这是占位模板。用 `python cli/main.py new-game <id>` 复制后填写。
# 复制后本文件的 id 必须与目录名一致，否则装载会报错。
#
# 受 spec/game_config.schema.json 约束。
# 修改后必须跑：python cli/main.py validate --game <id>
#
# 填法参考：labs/lottery/studies/dlt/game.yaml（一个完整的真实彩种）

id: PLACEHOLDER_ID            # ← 必须与目录名一致
name: PLACEHOLDER_NAME
config_version: "2.0"
owner: PLACEHOLDER_OWNER

# ---------------------------------------------------------------- 机器参数
# 号码空间的定义。T = ∏ C(pool_size_i, pick_i) 由此机械算出。
# ⚠️ 不要在这里写"分析结论"。
machine:
  zones:
    - key: front
      label: 前区
      pool_size: 35           # ← 改成实际号码池大小
      pick: 5                 # ← 改成实际每注选取个数
      ordered: false          # 有序（如排列型）填 true
      min_value: 1
    # - key: back             # 多区彩种加第二区（如大乐透后区 12 选 2）
    #   label: 后区
    #   pool_size: 12
    #   pick: 2
    #   ordered: false
    #   min_value: 1
  draw_days: []               # ISO 星期数字：周一=1 … 周日=7
  draw_time: "00:00"          # "HH:MM"

# ---------------------------------------------------------------- 特征
# 可从一注号码机械计算的派生特征。
# strategy.json 的 machine_rule.predicate 只能引用此处声明的 key。
#
# ★ config_version 2.0 起：特征用 `primitive` + `args` 声明，**可被框架执行**。
#   - primitive 必须是 platform/core/features.py 的 PRIMITIVES 之一（21 个）
#   - args.zone 指定作用区；多区彩种必须显式给
#   - formula 仅作人读注释，**不参与求值**
#   - 跑 `python cli/main.py validate --game <id>` 会静态检查声明可执行性
#
# ⚠️ type 必须是 spec/game_config.schema.json 允许的枚举之一。
features:
  - key: front_sum
    label: 和值
    type: integer
    primitive: sum
    args: {zone: front}
    formula: "sum(front)"     # 仅注释
    range: [15, 165]

# ---------------------------------------------------------------- 奖金模型
# ⚠️ 红线：epochs[].sum_affects_numbers 必须恒为 false。
#    依据：奖金规则变更不改变号码分布（见 memory/facts/FACTS.jsonl F-0014）。
prize_model:
  current_epoch: E0
  return_rate: 0.51           # ← 改成实际返奖率；未知填 null
  epochs:
    - id: E0
      label: 占位 epoch（请按真实规则变更史分段）
      from_period: null       # 期号，如 "07001"
      to_period: null         # 期号或 null（表示至今）
      levels: 0               # 奖级数；未知填 0
      cap_rules: []
      sum_affects_numbers: false   # ← 红线，不得改为 true
      note: "占位。真实彩种必须按官方规则变更史分段。"

# ---------------------------------------------------------------- 数据
data:
  raw:
    - path: data/raw/PLACEHOLDER.csv
      sha256: ""              # ← 必须实算，禁止手填
      rows: 0
      period_range: ["", ""]
  derived: []
  columns: {}                 # 原始列名 → 含义
  caveats:                    # 数据本身的减损项（引用数据前必读）
    - "占位。真实彩种必须写明：缺失期、口径变化、字段含义歧义。"

# ---------------------------------------------------------------- 轮次登记
# 每完成一轮，追加一条。date 为 null 表示尚在计划中。
iterations:
  - round: "round01"
    date: null
    status: planned
    note: "占位。完成一轮后填写 date / status / 主要产出。"

# ---------------------------------------------------------------- 输出接口
strategy_output:
  path: strategy/strategy.json
  schema: spec/strategy.schema.json
